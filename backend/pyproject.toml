[project]
name = "ip-sakti-rag"
version = "0.1.0"
description = "IP-SAKTI Sahayak Intelligent IP & Regulatory Guidance for Ayurveda"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf",
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-huggingface",
    "langchain-chroma",
    "sentence-transformers",
    "groq",
    "joblib",
    "scikit-learn==1.6.1",
    "pandas",
    "chromadb",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "python-dotenv",
    "google-generativeai",
    "river==0.26.1",
]

[project.optional-dependencies]
notebook = ["ipykernel"]
