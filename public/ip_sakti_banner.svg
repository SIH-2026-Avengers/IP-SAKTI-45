<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="emeraldGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoGlow" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="emeraldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .title { font-weight: 800; letter-spacing: -0.03em; }
    .subtitle { font-weight: 400; letter-spacing: -0.01em; }
    .badge-text { font-size: 13px; font-weight: 600; letter-spacing: 0.05em; }
    .pill-title { font-size: 20px; font-weight: 700; }
    .pill-subtitle { font-size: 12px; font-weight: 500; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="420" fill="url(#indigoGlow)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
  </g>

  <!-- Top Pill / Hackathon Badge -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#132338" stroke="#059669" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="5" fill="#10b981"/>
    <text x="32" y="21" fill="#34d399" class="font-mono badge-text">SMART INDIA HACKATHON 2026</text>
    <rect x="238" y="5" width="62" height="22" rx="11" fill="#065f46"/>
    <text x="269" y="19.5" fill="#a7f3d0" text-anchor="middle" font-size="11" font-weight="700" class="font-mono">SIH 26045</text>
  </g>

  <!-- Main Title & Logo Icon -->
  <g transform="translate(60, 140)">
    <!-- Shield / Ayurvedic Emblem Icon -->
    <g transform="translate(0, -50)">
      <rect width="64" height="64" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
      <!-- Legal Scales + Leaf Motif in SVG -->
      <path d="M32 14 C24 22 20 30 20 38 C20 45 25.5 50 32 50 C38.5 50 44 45 44 38 C44 30 40 22 32 14 Z" fill="none" stroke="url(#emeraldText)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M32 24 L32 46" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="32" cy="20" r="2.5" fill="#f59e0b"/>
      <line x1="24" y1="28" x2="40" y2="28" stroke="url(#emeraldText)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Headings -->
    <text x="80" y="-12" fill="#ffffff" font-size="44" class="font-sans title">
      IP-SAKTI Sahayak <tspan fill="url(#emeraldText)" font-size="34" font-weight="600">(IP-शक्ति सहायक)</tspan>
    </text>
    <text x="80" y="24" fill="#94a3b8" font-size="18" class="font-sans subtitle">
      Intelligent, Evidence-Grounded IP &amp; Regulatory Intelligence System for Indian AYUSH &amp; Ayurveda
    </text>
    <text x="80" y="50" fill="#64748b" font-size="14" class="font-mono">
      Patents Act 1970 • Drugs &amp; Cosmetics Rules 1945 (Schedule T) • Biological Diversity Act 2002 • FSSAI 2022
    </text>
  </g>

  <!-- 4 Feature Metric Cards at Bottom -->
  <g transform="translate(60, 260)">
    <!-- Card 1: Statutory Corpus -->
    <g transform="translate(0, 0)">
      <rect width="250" height="110" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="110" rx="2" fill="#10b981"/>
      <text x="24" y="34" fill="#64748b" font-size="12" font-weight="600" class="font-sans" letter-spacing="0.05em">KNOWLEDGE BASE</text>
      <text x="24" y="66" fill="#f8fafc" class="font-sans pill-title">21 Statutory Acts</text>
      <text x="24" y="90" fill="#34d399" class="font-mono pill-subtitle">6,352 ChromaDB Vectors</text>
    </g>

    <!-- Card 2: Legal Regimes -->
    <g transform="translate(276, 0)">
      <rect width="250" height="110" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="110" rx="2" fill="#f59e0b"/>
      <text x="24" y="34" fill="#64748b" font-size="12" font-weight="600" class="font-sans" letter-spacing="0.05em">MACHINE LEARNING</text>
      <text x="24" y="66" fill="#f8fafc" class="font-sans pill-title">12 Legal Regimes</text>
      <text x="24" y="90" fill="#fbbf24" class="font-mono pill-subtitle">Calibrated ML Classifier</text>
    </g>

    <!-- Card 3: Dual LLM Engines -->
    <g transform="translate(552, 0)">
      <rect width="250" height="110" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="110" rx="2" fill="#6366f1"/>
      <text x="24" y="34" fill="#64748b" font-size="12" font-weight="600" class="font-sans" letter-spacing="0.05em">DUAL-LLM HYBRID</text>
      <text x="24" y="66" fill="#f8fafc" class="font-sans pill-title">Groq + Gemini</text>
      <text x="24" y="90" fill="#818cf8" class="font-mono pill-subtitle">LPU Retrieval &amp; Insights</text>
    </g>

    <!-- Card 4: Languages & UI -->
    <g transform="translate(828, 0)">
      <rect width="250" height="110" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="4" height="110" rx="2" fill="#ec4899"/>
      <text x="24" y="34" fill="#64748b" font-size="12" font-weight="600" class="font-sans" letter-spacing="0.05em">LOCALIZED ACCESSIBILITY</text>
      <text x="24" y="66" fill="#f8fafc" class="font-sans pill-title">10 Languages</text>
      <text x="24" y="90" fill="#f472b6" class="font-mono pill-subtitle">Native Script Support</text>
    </g>
  </g>
</svg>
