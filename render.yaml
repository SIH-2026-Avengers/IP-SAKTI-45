services:
  # ============================================================
  # 1. IP-SAKTI Sahayak - FastAPI Backend Web Service
  # ============================================================
  - type: web
    name: ip-sakti-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip uv && uv sync --locked --no-dev"
    startCommand: "uv run --locked --no-sync python start.py"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # ============================================================
  # 2. IP-SAKTI Sahayak - React + Vite Frontend Static Site
  # ============================================================
  - type: web
    name: ip-sakti-frontend
    env: static
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ip-sakti-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
