services:
  # ============================================================
  # 1. IP-SAKTI Sahayak - FastAPI Backend Web Service
  # ============================================================
  - type: web
    name: ip-sakti-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # ============================================================
  # 2. IP-SAKTI Sahayak - React + Vite Frontend Static Site
  # ============================================================
  - type: static
    name: ip-sakti-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ip-sakti-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
